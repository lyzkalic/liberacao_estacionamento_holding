<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auditoria</title>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">

    <style>
        /* === Configuração Base === */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
        }

        html {
            height: 100%;
        }

        body {
            min-height: 100vh !important;
            display: flex !important;
            flex-direction: column !important;
            justify-content: flex-start !important;
            align-items: center !important;
            gap: 28px;
            padding: 60px 20px 60px;
            overflow-x: hidden !important;
            overflow-y: auto !important;
            position: relative !important;

            /* Configuração do fundo padrão (Claro) */
            background-image: url('assets/fundoclaro.svg') !important;
            background-size: cover !important;
            background-position: center !important;
            background-repeat: no-repeat !important;
            background-attachment: fixed !important;
            z-index: 1 !important;
            transition: background-image 0.5s ease-in-out;
        }

        /* Quando o Modo Escuro estiver ativo */
        html.dark-mode,
        body.dark-mode {
            background-image: url('assets/fundoescuro.svg') !important;
        }

        /* === ESTILOS DO BOTÃO PILULA (SWITCH) === */
        .switch-container {
            position: fixed !important;
            top: 20px;
            left: 20px;
            z-index: 99999;
            width: 90px;
            height: 46px;
            background-color: #1e302b;
            border-radius: 30px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }

        .switch-icon {
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            pointer-events: none;
        }

        .switch-thumb {
            position: absolute;
            top: 4px;
            left: 4px;
            width: 38px;
            height: 38px;
            background-color: rgba(255, 255, 255, 0.25);
            border-radius: 50%;
            z-index: 1;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body.dark-mode .switch-thumb {
            transform: translateX(44px);
        }

        .acoes-topo {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 10px;
            position: fixed !important;
            top: 20px;
            right: 20px;
            z-index: 99999;
        }

        .acoes-topo a,
        .acoes-topo button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 20px;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            color: #1e302b;
            font-size: 0.85rem;
            font-weight: 600;
            text-decoration: none;
            box-shadow: 0 8px 15px rgba(30, 48, 43, 0.15);
            transition: background-color 0.2s ease, transform 0.1s ease;
            cursor: pointer;
            font-family: inherit;
        }

        .acoes-topo a:hover,
        .acoes-topo button:hover {
            background: rgba(255, 255, 255, 0.65);
        }

        .acoes-topo a:active,
        .acoes-topo button:active {
            transform: scale(0.98);
        }

        .acoes-topo .link-sair {
            background: rgba(217, 83, 79, 0.55) !important;
            color: #ffffff;
            border-color: rgba(217, 83, 79, 0.6) !important;
        }

        .acoes-topo .link-sair:hover {
            background: rgba(201, 72, 66, 0.75) !important;
        }

        body.dark-mode .acoes-topo a,
        body.dark-mode .acoes-topo button {
            background: rgba(255, 255, 255, 0.2) !important;
            color: #ffffff !important;
            border-color: rgba(255, 255, 255, 0.1) !important;
        }

        body.dark-mode .acoes-topo .link-sair {
            background: #e0524d !important;
            color: #ffffff !important;
        }

        .page-logo {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
        }

        .page-logo img {
            display: block;
            width: 130px;
            max-width: 30vw;
            height: auto;
            filter: drop-shadow(0 6px 14px rgba(30, 48, 43, 0.25));
        }

        .login-card {
            background: rgba(255, 255, 255, 0.70) !important;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(30, 48, 43, 0.15) !important;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6) !important;
            padding: 25px 25px 45px;
            width: 100%;
            max-width: 1040px;
            position: relative !important;
            z-index: 10 !important;
            text-align: center;
            color: #1e302b !important;
            animation: fadeInCard 0.8s ease-out;
            overflow: hidden;
        }

        h1 {
            font-size: 30px;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #1e302b;
            margin-bottom: 55px;
        }

        .filtros {
            margin-bottom: 10px;
        }

        .filtros-linha {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 24px;
        }

        .filtros-linha-datas {
            justify-content: center;
            margin-bottom: 14px;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
            text-align: left;
            flex: 1;
            min-width: 160px;
        }

        .campo-data {
            flex: 0 1 170px;
            text-align: center;
        }

        .campo-data .input-wrapper {
            display: flex;
            justify-content: center;
        }

        .campo-data input[type="date"] {
            width: auto;
            max-width: 140px;
            text-align: center;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 8px;
            color: rgba(30, 48, 43, 0.8);
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper input,
        .input-wrapper select {
            width: 100%;
            padding: 10px 4px;
            background: transparent;
            border: none;
            border-bottom: 2px solid rgba(30, 48, 43, 0.2);
            color: #1e302b;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
            font-weight: 500;
            font-family: inherit;
        }

        .input-wrapper select {
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg fill='%231e302b' height='24' viewBox='0 0 24 24' width='24' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/></svg>");
            background-repeat: no-repeat;
            background-position: right 4px center;
            background-size: 18px;
            padding-right: 24px;
        }

        .input-wrapper select option {
            background-color: #ffffff;
            color: #1e302b;
        }

        .input-wrapper input:focus,
        .input-wrapper select:focus {
            border-bottom-color: #1e302b;
        }

        .input-wrapper input::placeholder {
            color: rgba(30, 48, 43, 0.35);
            font-weight: 400;
        }

        .filtros-botoes {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 30px;
        }

        .filtros-botoes-esquerda,
        .filtros-botoes-direita {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn-pill {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: auto;
            padding: 13px 28px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.3px;
            cursor: pointer;
            border: none;
            transition: background-color 0.3s, transform 0.1s;
            font-family: inherit;
        }

        .btn-pill:active {
            transform: scale(0.98);
        }

        .btn-pill.btn-primario {
            background-color: #1e302b;
            color: #ffffff;
            box-shadow: 0 8px 15px rgba(30, 48, 43, 0.2);
        }

        .btn-pill.btn-primario:hover {
            background-color: #2b453e;
        }

        .btn-pill.btn-secundario {
            background: rgba(255, 255, 255, 0.5);
            color: #1e302b;
            border: 1px solid rgba(30, 48, 43, 0.3);
        }

        .btn-pill.btn-secundario:hover {
            background: rgba(255, 255, 255, 0.75);
        }

        .tabela-wrapper {
            width: 100%;
            max-width: 100%;
            overflow-x: auto;
            border-radius: 12px;
        }

        .tabela-auditoria {
            width: 100%;
            min-width: 750px;
            table-layout: fixed;
            border-collapse: collapse;
            font-size: 0.85rem;
        }

        .tabela-auditoria th,
        .tabela-auditoria td {
            padding: 12px 10px;
            text-align: left;
            white-space: normal;
            word-break: break-word;
        }

        .tabela-auditoria th {
            background: rgba(30, 48, 43, 0.85);
            color: #ffffff;
            font-weight: 600;
            position: sticky;
            top: 0;
        }

        .tabela-auditoria tbody tr:nth-child(odd) {
            background: rgba(255, 255, 255, 0.25);
        }

        .tabela-auditoria tbody tr:nth-child(even) {
            background: rgba(255, 255, 255, 0.45);
        }

        .tabela-auditoria tbody tr:hover {
            background: rgba(255, 255, 255, 0.65);
        }

        .tabela-auditoria tbody td {
            color: #1e302b;
        }

        .btn-detalhes {
            background: #1e302b;
            color: #ffffff;
            border: none;
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-detalhes:hover {
            background: #2b453e;
        }

        /* === PAINEL LATERAL === */
        .sidebar-detalhes {
            position: absolute;
            top: 0;
            right: -360px;
            width: 340px;
            height: 100%;
            background: #ffffff;
            box-shadow: -10px 0 25px rgba(0, 0, 0, 0.15);
            z-index: 100;
            transition: right 0.35s ease-in-out;
            padding: 30px 24px;
            text-align: left;
            display: flex;
            flex-direction: column;
        }

        .sidebar-detalhes.aberta {
            right: 0;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
            padding-bottom: 12px;
            margin-bottom: 20px;
        }

        .sidebar-header h2 {
            font-size: 18px;
            color: #1e302b;
        }

        .btn-fechar-sidebar {
            background: transparent;
            border: none;
            font-size: 20px;
            font-weight: bold;
            color: #1e302b;
            cursor: pointer;
        }

        .sidebar-conteudo {
            font-size: 13px;
            color: #ffffff;
            overflow-y: auto;
            flex: 1;
        }

        .sidebar-item {
            margin-bottom: 14px;
        }

        .sidebar-item strong {
            display: block;
            color: #1e302b;
            font-size: 11px;
            text-transform: uppercase;
            margin-bottom: 2px;
        }

        .sidebar-mensagem-box {
            background: #f4f6f5;
            padding: 12px;
            border-radius: 8px;
            border-left: 4px solid #1e302b;
            font-size: 13px;
            line-height: 1.4;
            word-break: break-word;
        }

        @keyframes fadeInCard {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .resultado:empty {
            display: none;
        }

        /* === MODO ESCURO === */
        body.dark-mode .login-card {
            background: rgba(18, 24, 22, 0.90) !important;
            border: 1px solid rgba(255, 255, 255, 0.15) !important;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5) !important;
        }

        body.dark-mode h1,
        body.dark-mode label,
        body.dark-mode .filtros label {
            color: #ffffff !important;
        }

        body.dark-mode input,
        body.dark-mode select,
        body.dark-mode .filtros input,
        body.dark-mode .filtros select {
            color: #ffffff !important;
            border-bottom-color: rgba(255, 255, 255, 0.4) !important;
        }

        body.dark-mode select {
            background-image: url("data:image/svg+xml;utf8,<svg fill='%23ffffff' height='24' viewBox='0 0 24 24' width='24' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/></svg>");
        }

        body.dark-mode select option {
            background-color: #1a2622;
            color: #ffffff;
        }

        body.dark-mode input::placeholder {
            color: rgba(255, 255, 255, 0.5) !important;
        }

        body.dark-mode .tabela-auditoria tbody tr:nth-child(odd) {
            background: rgba(255, 255, 255, 0.05);
        }

        body.dark-mode .tabela-auditoria tbody tr:nth-child(even) {
            background: rgba(255, 255, 255, 0.12);
        }

        body.dark-mode .tabela-auditoria tbody td {
            color: #ffffff;
        }

        body.dark-mode .sidebar-detalhes {
            background: #1a2622;
            color: #ffffff;
        }

        body.dark-mode .sidebar-header h2,
        body.dark-mode .btn-fechar-sidebar,
        body.dark-mode .sidebar-item strong {
            color: #ffffff;
        }

        body.dark-mode .sidebar-mensagem-box {
            background: #121816;
            color: #e0e0e0;
            border-left-color: #3b5e54;
        }
    </style>
</head>

<body>

    <!-- BOTÃO SWITCH -->
    <div class="switch-container" id="toggle-theme" role="button" aria-label="Alternar tema">
        <div class="switch-thumb"></div>

        <div class="switch-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="5"></circle>
                <line x1="12" y1="1" x2="12" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="23"></line>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                <line x1="1" y1="12" x2="3" y2="12"></line>
                <line x1="21" y1="12" x2="23" y2="12"></line>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
        </div>

        <div class="switch-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
        </div>
    </div>

    <!-- ACOES TOPO -->
    <div class="acoes-topo">
        <a href="/">Buscar CPF</a>
        <a href="/logout" class="link-sair">Sair</a>
    </div>

    <div class="page-logo">
        <img src="assets/logo.svg" alt="Sá Cavalcante">
    </div>

    <div class="login-card">

        <!-- PAINEL LATERAL -->
        <div class="sidebar-detalhes" id="sidebarDetalhes">
            <div class="sidebar-header">
                <h2>Detalhes</h2>
                <button type="button" class="btn-fechar-sidebar" id="btnFecharSidebar">&times;</button>
            </div>
            <div class="sidebar-conteudo">
                <div class="sidebar-item">
                    <strong>Data / Hora</strong>
                    <span id="detalheData">-</span>
                </div>
                <div class="sidebar-item">
                    <strong>Usuário</strong>
                    <span id="detalheUsuario">-</span>
                </div>
                <div class="sidebar-item">
                    <strong>Resultado / Evento</strong>
                    <span id="detalheResultado">-</span>
                </div>
                <div class="sidebar-item">
                    <strong>Mensagem Completa</strong>
                    <div class="sidebar-mensagem-box" id="detalheMensagem">-</div>
                </div>
            </div>
        </div>

        <h1>Histórico de Auditoria</h1>

        <form id="formFiltros" autocomplete="off">
            <div class="filtros">
                <div class="filtros-linha filtros-linha-datas">
                    <div class="input-group campo-data">
                        <label for="filtroDataInicial">Data Inicial</label>
                        <div class="input-wrapper">
                            <input type="date" id="filtroDataInicial">
                        </div>
                    </div>

                    <div class="input-group campo-data">
                        <label for="filtroDataFinal">Data Final</label>
                        <div class="input-wrapper">
                            <input type="date" id="filtroDataFinal">
                        </div>
                    </div>
                </div>

                <div class="filtros-linha">
                    <div class="input-group">
                        <label for="filtroCpf">CPF</label>
                        <div class="input-wrapper">
                            <input type="text" id="filtroCpf" placeholder="000.000.000-00">
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="filtroUsuario">Usuário</label>
                        <div class="input-wrapper">
                            <input type="text" id="filtroUsuario" placeholder="Nome de usuário">
                        </div>
                    </div>

                    <!-- Dropdown Novo: Tipo de Ação -->
                    <div class="input-group">
                        <label for="filtroTipoAcao">Tipo de Ação</label>
                        <div class="input-wrapper">
                            <select id="filtroTipoAcao">
                                <option value="">Todas</option>
                                <option value="LOGIN">Login</option>
                                <option value="CONSULTA_CPF">Consulta CPF</option>
                                <option value="LIBERACAO_TICKET">Liberação ticket</option>
                            </select>
                        </div>
                    </div>

                    <!-- Dropdown de Status -->
                    <div class="input-group">
                        <label for="filtroStatus">Status</label>
                        <div class="input-wrapper">
                            <select id="filtroStatus">
                                <option value="">Todos</option>
                                <option value="SUCESSO">Sucesso</option>
                                <option value="ERRO">Erro</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
        </form>

        <!-- BARRA DE BOTÕES -->
        <div class="filtros-botoes">
            <div class="filtros-botoes-esquerda">
                <button type="button" id="btnPesquisar" class="btn-pill btn-primario">Pesquisar</button>
                <button type="button" id="btnLimpar" class="btn-pill btn-secundario">Limpar Filtros</button>
            </div>
            <div class="filtros-botoes-direita">
                <button type="button" id="btnExportar" class="btn-pill btn-secundario">Exportar Excel</button>
            </div>
        </div>

        <div class="tabela-wrapper" id="tabelaContainer">
            <table class="tabela-auditoria">
                <thead>
                    <tr>
                        <th>Data/Hora</th>
                        <th>Usuário</th>
                        <th>Perfil</th>
                        <th>CPF Cliente</th>
                        <th>Número Ticket</th>
                        <th>ID Transação</th>
                        <th>ID Garagem</th>
                        <th>Resultado</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="corpoTabela"></tbody>
            </table>
        </div>

        <div id="mensagem" class="resultado" aria-live="polite"></div>

    </div>

    <script src="js/auditoria.js?v=6"></script>

    <script>
    document.addEventListener("DOMContentLoaded", function() {
        const body = document.body;
        const html = document.documentElement;
        const botaoFundo = document.getElementById('toggle-theme');
        const btnLimpar = document.getElementById('btnLimpar');
        const formFiltros = document.getElementById('formFiltros');

        // Alternância e persistência de Tema (Light / Dark)
        const temaSalvo = localStorage.getItem('theme');
        if (temaSalvo === 'dark') {
            html.classList.add('dark-mode');
            body.classList.add('dark-mode');
        } else {
            html.classList.remove('dark-mode');
            body.classList.remove('dark-mode');
        }

        if (botaoFundo) {
            botaoFundo.addEventListener('click', (e) => {
                e.preventDefault();
                html.classList.toggle('dark-mode');
                const mudouParaEscuro = body.classList.toggle('dark-mode');
                localStorage.setItem('theme', mudouParaEscuro ? 'dark' : 'light');
            });
        }

        // Ação do Botão "Limpar Filtros"
        if (btnLimpar && formFiltros) {
            btnLimpar.addEventListener('click', () => {
                formFiltros.reset();
            });
        }
    });
    </script>

</body>
</html>
